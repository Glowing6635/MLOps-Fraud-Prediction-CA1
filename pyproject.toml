[project]
name = "mlops-fraud-prediction-ca1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "spiralsky", email = "shianastrophysics@gmail.com" }
]
requires-python = "~=3.12.0"
dependencies = [
    "ipykernel>=7.4.0",
    "jinja2>=3.1.6",
    "pandas>=3.1.1",
]

[project.scripts]
mlops-fraud-prediction-ca1 = "mlops_fraud_prediction_ca1:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.18.1",
    "jupytext>=1.19.6",
    "load-clean[notebook,tools]",
    "nbformat>=5.11.1",
    "traitlets>=5.16.1",
]

[tool.uv.sources]
load-clean = { git = "https://github.com/SpiralSky/NotebookHelpers.git", rev = "main" }
