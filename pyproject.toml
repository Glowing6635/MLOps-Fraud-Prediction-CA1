[project]
name = "mlops-fraud-prediction-ca1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "spiralsky", email = "shianastrophysics@gmail.com" }
]
requires-python = "~=3.12.0"
dependencies = [
    "boto3>=1.44.10",
    "mlflow==3.18.0",
    "pandas>=3.1.1",
    "pymysql[rsa]>=1.2.4",
    "python-dotenv>=1.2.4",
    "scikit-learn==1.9.1",
    "skops==0.16.0",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
champion-pick = "mlops_fraud_prediction_ca1.champion:main"
mlops-fraud-prediction-ca1 = "mlops_fraud_prediction_ca1:main"
log-test-run = "mlops_fraud_prediction_ca1.log_test_run:main"
redeploy-check = "mlops_fraud_prediction_ca1.redeploy_check:main"
rds-schema = "mlops_fraud_prediction_ca1.rds_schema:main"
rehearsal-grant = "mlops_fraud_prediction_ca1.rehearsal_grants:main"
train = "mlops_fraud_prediction_ca1.training:main"
load-batch = "mlops_fraud_prediction_ca1.loading:main"
run-batch = "mlops_fraud_prediction_ca1.batch:main"
retrain-batch = "mlops_fraud_prediction_ca1.retrain:main"
rehearsal-reset = "mlops_fraud_prediction_ca1.rehearsal_reset:main"
rule-report = "mlops_fraud_prediction_ca1.rule_report:main"
champion-scores = "mlops_fraud_prediction_ca1.champion_scores:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jinja2>=3.1.6",
    "jupytext>=1.19.6",
    "matplotlib>=3.11.2",
    "moto>=5.2.6",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "seaborn>=0.13.2",
]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "T20"]

[tool.ruff.lint.per-file-ignores]
# Command entry points, where printing is their output.
"src/mlops_fraud_prediction_ca1/__init__.py" = ["T201"]
"src/mlops_fraud_prediction_ca1/redeploy_check.py" = ["T201"]
"src/mlops_fraud_prediction_ca1/rds_schema.py" = ["T201"]
"src/mlops_fraud_prediction_ca1/training.py" = ["T201"]
"src/mlops_fraud_prediction_ca1/loading.py" = ["T201"]
"src/mlops_fraud_prediction_ca1/retrain.py" = ["T201"]
"src/mlops_fraud_prediction_ca1/champion_scores.py" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["src"]
